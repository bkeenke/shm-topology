<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — SHM Topology</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕸</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<form id="loginForm" class="login-card" autocomplete="on">
  <div class="brand">SHM <b>Topology</b></div>
  <label class="field">Логин
    <input id="login" name="username" class="input" autocomplete="username" required autofocus>
  </label>
  <label class="field">Пароль
    <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
  </label>
  <div id="err" class="login-err"></div>
  <button id="go" class="btn primary">Войти</button>
</form>
<script src="/login.js"></script>
</body>
</html>
